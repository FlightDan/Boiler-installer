# Both sensor backends read whole firmware/image transactions in one SPI message,
# so the per-transfer buffer must cover the largest of them:
#   FTE3600 needs 65535 bytes (its transfer_capacity, clamped to this value);
#   BF63112 needs at least 1 + 1 + 96*112 = 10754 bytes for an atomic FIFO read.
# 16384 satisfies BF63112 alone but silently truncates FTE3600, so use 65536.
# Applies when spidev loads; never unload a shared spidev module to change it.
options spidev bufsiz=65536
